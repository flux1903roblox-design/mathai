name = "madregot-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated origins allowed to call the API from another address (local dev, or a copy of the
# app hosted elsewhere). The app served by this Worker itself is same-origin and needs no entry.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
# Claude model for every AI action. Cheaper option: claude-haiku-5-5.
CLAUDE_MODEL = "claude-opus-5-5"
# AI actions per student per day, and per device for students practising alone.
AI_DAILY_LIMIT = "40"
SOLO_DAILY_LIMIT = "20"
# "false" turns off AI for students who are not in a class.
ALLOW_SOLO_AI = "true"

# The secret ANTHROPIC_API_KEY is set with: npx wrangler secret put ANTHROPIC_API_KEY

# The same Worker serves the built web app (web/dist), so the app and its API share one address
# (production builds call the API on their own address unless VITE_API_URL says otherwise).
# Requests under /api/ run the Worker code; everything else is a static file.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "madregot"
database_id = "REPLACE_WITH_DATABASE_ID"
