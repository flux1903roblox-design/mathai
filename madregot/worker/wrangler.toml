name = "madregot-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated origins allowed to call the API from another address (local dev, or a copy of the
# app hosted elsewhere). The app served by this Worker itself is same-origin and needs no entry.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
# The address of the app (links, QR codes, payment return pages and emails use it), e.g. https://madregot.example
PUBLIC_URL = ""

# ---- the paid AI tutor (see SUBSCRIPTION.md) ----
# "off" (the default) keeps the AI limits from before the paid tutor; "on" turns on the free taste and the paid tiers.
AI_PAYWALL = "off"
# Classes created before BILLING_START keep the old limits until LEGACY_CLASS_AI_UNTIL (both YYYY-MM-DD, Jerusalem).
BILLING_START = ""
LEGACY_CLASS_AI_UNTIL = ""
# Claude model for every full answer; FREE_MODEL for the free taste and economy mode (empty = the low-cost default in shared/ai.js).
CLAUDE_MODEL = "claude-sonnet-5-5"
FREE_MODEL = "claude-haiku-5-5"
# With the switch off: AI actions a day per class student, per teacher, and per network for students without a class.
AI_DAILY_LIMIT = "40"
TEACHER_DAILY_LIMIT = "200"
SOLO_DAILY_LIMIT = "20"
# "false" turns off AI for people who are not in a class (and, with the switch on, without a family plan).
ALLOW_SOLO_AI = "true"
# A parent's OK before a child alone uses the tutor (trust spec TRUST-9): "required" (the default) answers a device with
# no class, no teacher and no parent's link with parent_ok_needed; a parent approves it once, for free, on the parents'
# page. "off" turns the check off (the free taste is open to any device again): the one-variable rollback.
AI_PARENT_OK = "required"
# The free taste: questions a day per person, and the shared ceilings behind it (per network for anonymous devices,
# per class, and in total). Other limits are overridable with AI_LIMITS (JSON), see worker/src/entitle.js.
FREE_DAILY_LIMIT = "2"
FREE_NET_DAILY = "80"
FREE_CLASS_DAILY = "80"
FREE_GLOBAL_DAILY = "3000"
# Budgets in US dollars, read from what Claude really cost (table ai_spend).
FREE_DAILY_BUDGET_USD = "5"
TRIAL_DAILY_BUDGET_USD = "10"
FAMILY_MONTHLY_BUDGET_USD = "4"
CLASS_SEAT_MONTHLY_BUDGET_USD = "0.8"
OWNER_ALERT_USD = "20"
# "true": every night the owner gets a summary of yesterday (spend, plans, what needs a hand, invariant checks).
OWNER_DAILY_SUMMARY = "true"
# Prices in agorot, VAT included (VAT_MODE "included", or "exempt" for an exempt dealer).
PRICE_FAMILY_MONTH_AGOROT = "2990"
PRICE_FAMILY_YEAR_AGOROT = "24900"
PRICE_CLASS_SEAT_YEAR_AGOROT = "4900"
VAT_MODE = "included"
TERMS_VERSION = "2026-11"
# Payments: "manual" (the owner grants plans with npm run owner; schools pay by invoice) until a provider is chosen.
# "test" rehearses the whole flow on a preview Worker (also needs BILLING_MODE "test" and ALLOW_TEST_BILLING "true").
BILLING_PROVIDER = "manual"
BILLING_MODE = "live"
# Hosts the payment page may be on (comma-separated); checkout refuses any other.
BILLING_CHECKOUT_HOSTS = ""
# ---- the Ministry of Education's AI rules for schools (trust spec TRUST-11, shared/schoolRules.js) ----
# "none" until Madregot is in the Ministry's educational catalogue: student AI stays off in every school class, whatever
# the teacher chooses, and no AI class licence is sold to a school class (a quote request stays open). Private groups
# (lessons outside a school, attested by their teacher) work after the parents' consent. The owner's one action when
# the approval arrives (TRUST-14): set "approved" (and MOE_AI_FROM_GRADE to the first grade it covers), then deploy.
MOE_AI_APPROVAL = "none"
# The grade the approval starts at (the guidelines allow independent use from grade 7, never lower).
MOE_AI_FROM_GRADE = "7"
# Turnstile for new devices on the free taste: "off" unless free-tier abuse shows in ai_spend.
FREE_DEVICE_MINT = "off"
# Sign-in codes: at most this many sent a day in all (the owner gets a notice when it trips: nobody can sign in until
# midnight), and at most this many wrong codes a day from one network (so a stranger cannot burn a parent's codes).
MAIL_DAILY_CAP = "3000"
VERIFY_FAIL_NET_DAILY = "30"
# Business details for the checkout disclosure and the emails.
BUSINESS_NAME = ""
BUSINESS_ID = ""
BUSINESS_ADDRESS = ""
CONTACT_EMAIL = ""
CONTACT_PHONE = ""
OWNER_EMAIL = ""
# Codes and notices are sent from this address through Resend (the domain must be verified there).
EMAIL_FROM = ""

# Secrets (never in this file, never in the app), each set with: npx wrangler secret put <NAME>
#   ANTHROPIC_API_KEY       the owner's Claude API key
#   RESEND_API_KEY          sends codes and notices
#   AUTH_SECRET             keys sign-in codes (openssl rand -hex 32)
#   IP_HASH_SECRET          turns network addresses into counters, so no address is stored (openssl rand -hex 32)
#   WEBHOOK_PATH_SECRET     the secret part of the payment webhook's path (openssl rand -hex 32)
#   BILLING_WEBHOOK_SECRET  verifies a signing provider's webhooks (+ BILLING_WEBHOOK_SECRET_OLD while rotating)
#   TURNSTILE_SECRET, DEVICE_SECRET   only with FREE_DEVICE_MINT = "turnstile"
# TEST_WEBHOOK_SECRET belongs in .dev.vars only (the test provider).

# The hourly jobs: notices, cancellation retries, refunds, expired orders and plans. At 03:00 (Jerusalem): reconciliation
# with the payment provider, renewal and licence-ending reminders, the retention purge and the owner's daily summary.
[triggers]
crons = ["7 * * * *"]

# The same Worker serves the built web app (web/dist), so the app and its API share one address
# (production builds call the API on their own address unless VITE_API_URL says otherwise).
# Requests under /api/ run the Worker code; everything else is a static file.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "madregot"
database_id = "REPLACE_WITH_DATABASE_ID"
# Real databases change only through these migrations (npm run db:migrate); schema.sql is the reference.
migrations_dir = "migrations"

# ---- staging: a second Worker with its own database, for the load test of the Ministry catalogue's technical check
# (scripts/loadtest.mjs refuses any Worker whose GET /api/health does not say staging: true) and for the checker's test
# account. Wrangler does not carry [vars] or the database into an environment, so both are written out here. Once:
#   npx wrangler d1 create madregot-staging             (paste the id it prints into database_id below)
#   npm run staging:migrate
#   npx wrangler secret put AUTH_SECRET --env staging     and   npx wrangler secret put IP_HASH_SECRET --env staging
# Then each time: npm run staging:deploy   (npx wrangler deploy --env staging)
# No AI key, no email and no payments on staging: the AI, sign-in codes and checkout stay off there.
[env.staging]
name = "madregot-api-staging"

[env.staging.vars]
STAGING = "true"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
PUBLIC_URL = ""
AI_PAYWALL = "off"
BILLING_START = ""
LEGACY_CLASS_AI_UNTIL = ""
AI_DAILY_LIMIT = "40"
TEACHER_DAILY_LIMIT = "200"
SOLO_DAILY_LIMIT = "20"
ALLOW_SOLO_AI = "false"
# a child alone needs a parent's OK first, as in production (the safety lane's TRUST-9 var)
AI_PARENT_OK = "required"
FREE_DAILY_LIMIT = "2"
FREE_NET_DAILY = "80"
FREE_CLASS_DAILY = "80"
FREE_GLOBAL_DAILY = "3000"
OWNER_DAILY_SUMMARY = "false"
PRICE_FAMILY_MONTH_AGOROT = "2990"
PRICE_FAMILY_YEAR_AGOROT = "24900"
PRICE_CLASS_SEAT_YEAR_AGOROT = "4900"
VAT_MODE = "included"
TERMS_VERSION = "2026-11"
BILLING_PROVIDER = "manual"
BILLING_MODE = "live"
BILLING_CHECKOUT_HOSTS = ""
MOE_AI_APPROVAL = "none"
MOE_AI_FROM_GRADE = "7"
FREE_DEVICE_MINT = "off"
MAIL_DAILY_CAP = "3000"
VERIFY_FAIL_NET_DAILY = "30"
EMAIL_FROM = ""

[[env.staging.d1_databases]]
binding = "DB"
database_name = "madregot-staging"
database_id = "REPLACE_WITH_STAGING_DATABASE_ID"
migrations_dir = "migrations"
